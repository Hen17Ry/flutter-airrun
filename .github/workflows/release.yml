name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.1
  PNPM_VERSION: 11.12.0
  BUN_VERSION: 1.3.14

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      version: ${{ steps.version